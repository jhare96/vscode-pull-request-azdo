name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies and VS Code type definitions
        run: |
          # npm ci runs update-dts via postinstall, which downloads types from GitHub.
          for attempt in 1 2 3; do
            if npm ci; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Dependency installation failed after 3 attempts."
              exit 1
            fi
            echo "::warning::Dependency installation failed; retrying in 10 seconds (attempt $attempt of 3)."
            sleep 10
          done
        env:
          # Skip Playwright browser downloads to avoid installation failures
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Playwright browsers (if needed)
        run: |
          if [ -d "node_modules/playwright" ]; then
            echo "Installing Playwright browsers..."
            npx playwright install --with-deps
          else
            echo "Playwright not found, skipping browser installation"
          fi
        continue-on-error: true

      - name: Basic build verification
        run: |
          echo "Verifying basic setup..."
          if [ ! -d "node_modules" ]; then
            echo "❌ node_modules not found"
            exit 1
          fi
          if [ ! -f "node_modules/.bin/tsc" ]; then
            echo "❌ TypeScript compiler not found"
            exit 1
          fi
          if [ ! -f "node_modules/.bin/webpack" ]; then
            echo "❌ Webpack not found"
            exit 1
          fi
          echo "✅ Basic setup verification successful"
